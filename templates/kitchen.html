<h1>🍳 Kitchen Orders</h1>
<div id="orders" style="display: flex; flex-wrap: wrap; gap: 20px"></div>

<script>
  function complete(index) {
    fetch(`/complete/${index}`, { method: "POST" });
  }

  setInterval(() => {
    fetch("/orders")
      .then((r) => r.json())
      .then((data) => {
        document.getElementById("orders").innerHTML = data
          .map(
            (o, i) => `
                <div style="
                    border:2px solid black;
                    padding:10px;
                    width:220px;
                    margin-bottom:10px;
                ">
                    <h3>Table ${o.table}</h3>
                    <ul>
                        ${o.items.map((item) => `<li>${item}</li>`).join("")}
                    </ul>
                    ${o.comment ? `<p><b>📝 Note:</b><br>${o.comment}</p>` : ""}
                    <button onclick="complete(${i})">✅ Complete</button>
                </div>
                `
          )
          .join("");
      });
  }, 1000);
</script>
